name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-14
    defaults:
      run:
        working-directory: sailune-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          path: sailune-mobile
      - uses: actions/checkout@v4
        with:
          repository: styxnanda/sailune-go
          ref: v0.9.0
          path: sailune-cli
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: sailune-mobile/core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - name: Run widget and visual tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/flutter-tests.log"
      - name: Report test failure details
        if: failure()
        run: |
          python3 -m pip install --quiet --target "$RUNNER_TEMP/image-tools" pillow==11.3.0
          export PYTHONPATH="$RUNNER_TEMP/image-tools"
          python3 - <<'PY'
          import os, pathlib
          from PIL import Image, ImageChops
          for image in pathlib.Path('test/failures').glob('*_testImage.png'):
              master = image.with_name(image.name.replace('_testImage.png', '_masterImage.png'))
              if not master.exists():
                  continue
              actual, expected = Image.open(image).convert('RGBA'), Image.open(master).convert('RGBA')
              if actual.size != expected.size:
                  print(f'::error::{image.name}: size {actual.size} != {expected.size}')
                  continue
              diff = ImageChops.difference(actual, expected)
              deltas = [max(p) for p in diff.getdata()]
              counts = {n: sum(d > n for d in deltas) for n in [0, 1, 2, 4, 8, 16, 32, 64, 128]}
              print(f'::notice::{image.name}: bounds={diff.convert("RGB").getbbox()}, channel deltas={counts}')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'flutter-tests.log'
          if path.exists():
              lines = path.read_text().splitlines()
              for i, line in enumerate(lines):
                  if any(word in line for word in ['EXCEPTION CAUGHT', 'pixels', 'Expected:', 'Actual:', 'Test failed.', 'test description was:']):
                      detail = '\n'.join(lines[max(0, i-1):i+4])
                      detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error::' + detail)
          PY
      - run: go -C core test -race ./...
      - run: go -C core vet ./...
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sailune-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          path: sailune-mobile
      - uses: actions/checkout@v4
        with:
          repository: styxnanda/sailune-go
          ref: v0.9.0
          path: sailune-cli
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: sailune-mobile/core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          scripts/build-core.sh
      - run: flutter pub get
      - run: flutter build apk --release --target lib/main.dart --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sailune-android-v0.9.0
          path: sailune-mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: sailune-mobile
          script: flutter test integration_test/library_test.dart -d emulator-5554

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sailune-android-v0.9.0
          path: packages
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REF_NAME" = v0.9.0
          mv packages/app-release.apk packages/sailune-v0.9.0-android.apk
          (cd packages && sha256sum *.apk > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" packages/* --verify-tag --title "Sailune Android $GITHUB_REF_NAME" --notes-file docs/release-v0.9.0.md

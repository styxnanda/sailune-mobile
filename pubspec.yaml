name: sailune_mobile
description: A quiet home for your stories. Sailune for Android.
publish_to: none
version: 0.9.5+14
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/sailune.png
    - assets/sites/ao3.svg
    - assets/sites/ffn.svg
  fonts:
    - family: Sailune
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
